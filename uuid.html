<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID Oluşturucu</title>
<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #1e1e2f;
  color: #eee;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem;
}
.logo { width: 120px; height: auto; margin-bottom: 1rem; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.3); }
h1 { color: #f39c12; margin-bottom: 2rem; text-align:center; }
.card {
  background: #2e2e44;
  padding: 2rem;
  border-radius: 12px;
  width: 90%;
  max-width: 500px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
input { width: 100%; padding: 0.7rem; font-size: 1rem; margin: 0.5rem 0 1rem 0; border-radius: 6px; border: none; outline: none; background: #444466; color: #fff; }
button { background: #f39c12; border: none; color: #fff; padding: 0.7rem 1rem; font-size: 1rem; border-radius: 6px; cursor: pointer; margin-bottom: 1rem; width: 100%; }
button:hover { background: #e67e22; }
</style>
</head>
<body>

<img src="res/logo.png" alt="Logo" class="logo">
<h1>UUID Oluşturucu</h1>

<div class="card">
  <button id="generateUUID">UUID Oluştur</button>
  <input type="text" id="uuid" placeholder="UUID burada görünecek" readonly>
  <p>UUID’yi kopyalayın ve <a href="manifest.html" style="color:#f39c12;">Manifest Sayfasına</a> yapıştırın.</p>
</div>

<script>
async function fetchUUID() {
  try {
    const response = await fetch('https://www.uuidgenerator.net/api/version4');
    if (!response.ok) throw new Error('API hatası');
    const data = await response.text();
    return data.trim();
  } catch(err) {
    alert("UUID API hatası: " + err);
    return null;
  }
}

document.getElementById('generateUUID').addEventListener('click', async () => {
  const uuid = await fetchUUID();
  if(!uuid) return;
  document.getElementById('uuid').value = uuid;
});
</script>

</body>
</html>
